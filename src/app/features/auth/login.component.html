<div class="flex min-h-screen items-center justify-center bg-[#001021] p-4">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <img
        src="/qualiq-logo.svg"
        alt="QualiQ — Conheça. Decida. Melhore."
        width="1230"
        height="1130"
        class="mx-auto mb-4 h-auto w-48 sm:w-52"
      />
    </div>
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-2xl"
    >
      <label class="mb-1.5 block text-sm font-medium text-slate-300" for="email">E-mail</label>
      <div class="relative mb-4">
        <span appIcon="Mail" class="absolute left-3 top-3 h-4 w-4 text-slate-500"></span>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="w-full rounded-lg border border-slate-700 bg-slate-950 py-2.5 pl-10 pr-3 text-sm text-white outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
          placeholder="seu@email.com"
        />
      </div>
      <label class="mb-1.5 block text-sm font-medium text-slate-300" for="password">Senha</label>
      <div class="relative mb-5">
        <span appIcon="LockKeyhole" class="absolute left-3 top-3 h-4 w-4 text-slate-500"></span>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full rounded-lg border border-slate-700 bg-slate-950 py-2.5 pl-10 pr-3 text-sm text-white outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
          placeholder="••••••••"
        />
      </div>
      @if (error()) {
        <p
          class="mb-4 rounded-lg border border-rose-900/70 bg-rose-950/50 p-3 text-sm text-rose-300"
        >
          {{ error() }}
        </p>
      }
      <button
        type="submit"
        [disabled]="form.invalid || submitting()"
        class="flex w-full items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (submitting()) {
          <span appIcon="LoaderCircle" class="h-4 w-4 animate-spin"></span>
        }
        Entrar
      </button>
    </form>
    <div class="mt-5 flex items-center justify-center gap-2 text-xs text-slate-500">
      <span appIcon="ShieldCheck" class="h-4 w-4"></span> Acesso seguro e controlado
    </div>
  </div>
</div>
