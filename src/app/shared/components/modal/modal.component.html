@if (open()) {
  <div
    class="fixed inset-0 z-[70] flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
  >
    <button
      type="button"
      class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm"
      (click)="closed.emit()"
      aria-label="Fechar"
    ></button>
    <section
      class="relative flex max-h-[calc(100vh-2rem)] w-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl"
      [class]="width()"
    >
      <header class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
        <h2 class="font-semibold text-slate-800">{{ title() }}</h2>
        <button
          type="button"
          class="h-5 w-5 text-slate-400 hover:text-slate-700"
          (click)="closed.emit()"
        >
          <span appIcon="X"></span>
        </button>
      </header>
      <div class="overflow-y-auto p-5"><ng-content /></div>
      <ng-content select="[modal-footer]" />
    </section>
  </div>
}
