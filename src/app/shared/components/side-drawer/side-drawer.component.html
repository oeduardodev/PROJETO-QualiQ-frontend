@if (rendered()) {
  <div
    class="fixed inset-0 z-[70] flex justify-end"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
  >
    <button
      type="button"
      class="drawer-backdrop absolute inset-0 bg-black/30 backdrop-blur-sm"
      [class.drawer-backdrop-closing]="closing()"
      (click)="requestClose()"
      aria-label="Fechar"
    ></button>
    <section
      class="drawer-panel relative flex h-full w-full flex-col bg-white shadow-2xl"
      [class]="width()"
      [class.drawer-panel-closing]="closing()"
    >
      <header class="flex shrink-0 items-start justify-between border-b border-slate-100 px-6 py-4">
        <div class="min-w-0">
          <h2 class="text-base font-semibold text-slate-800">{{ title() }}</h2>
          @if (subtitle()) {
            <p class="mt-0.5 text-xs text-slate-400">{{ subtitle() }}</p>
          }
        </div>
        <button
          type="button"
          class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-md text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600"
          (click)="requestClose()"
          aria-label="Fechar"
        >
          <span appIcon="X" class="block h-5 w-5 shrink-0"></span>
        </button>
      </header>
      <div class="min-h-0 flex-1 overflow-y-auto px-6 py-5"><ng-content /></div>
      <ng-content select="[drawer-footer]" />
    </section>
  </div>
}
